{{- /* Every ServiceAccount of the chart; none mounts a token by itself, a pod projects the one it needs. */ -}}
{{- range list (list "v2b-archive" "archive") (list "v2b" "agent") (list "v2b" "agent-controller") (list "v2b" "dreamer") (list "v2b" "data-sync") (list "v2b" "dashboard") }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index . 1 }}
  namespace: {{ index . 0 }}
automountServiceAccountToken: false
{{- end }}
