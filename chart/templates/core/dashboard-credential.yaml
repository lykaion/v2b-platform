{{- /*
The dashboard's credential, a token Secret for the ServiceAccount dashboard. A credential is ended by a
release naming a new Secret in core.dashboardCredential: a Secret made again under the same name gives
the same token back.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "core.dashboardCredential is not set" .Values.core.dashboardCredential }}
  namespace: v2b
  annotations:
    kubernetes.io/service-account.name: dashboard
type: kubernetes.io/service-account-token
