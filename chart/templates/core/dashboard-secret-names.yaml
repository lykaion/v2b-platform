{{- /*
v2b-dashboard-secret-names: the access rules cannot hold a create to one name, so this policy refuses
the dashboard creating a Secret in v2b named anything but Claude's sign-in code (chart-and-policy.md).
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: v2b-dashboard-secret-names
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: v2b
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE]
      resources: [secrets]
  matchConditions:
  - name: by-the-dashboard
    expression: request.userInfo.username == "system:serviceaccount:v2b:dashboard"
  validations:
  - expression: object.metadata.name == {{ required "core.claudeCode is not set" .Values.core.claudeCode | quote }}
    message: the dashboard creates no Secret in v2b but {{ .Values.core.claudeCode }}
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: v2b-dashboard-secret-names
spec:
  policyName: v2b-dashboard-secret-names
  validationActions: [Deny]
